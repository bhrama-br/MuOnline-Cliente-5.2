; MainInfo do build WEB. O do PC e Client/MainInfo.ini, com o IP real.
;
; POR QUE UM ARQUIVO SEPARADO: o navegador nao abre socket TCP cru. O Emscripten
; traduz sockets POSIX em WebSocket e monta a URL como ws://<host>:<porta> a partir
; do endereco passado ao connect() -- entao o cliente Web tem de apontar para a
; PONTE (web/ws_tcp_bridge.py), nao para o servidor.
;
; A ponte nao pode escutar no mesmo host:porta do servidor, e no Windows nao ha
; apelido de loopback (bind em 127.0.0.2 volta PermissionError), entao a distincao e
; por PORTA: a ponte escuta 44406 e repassa para 44405.
;
;   python web/ws_tcp_bridge.py 127.0.0.1 192.168.1.253 44406
;
; (o terceiro argumento e a porta escutada; ajuste o destino dentro da ponte se o
; servidor mudar de porta)
[MainInfo]
IpAddress 			= 127.0.0.1
IpAddressPort 			= 44406

; Daqui para baixo, igual ao MainInfo.ini do servidor.
ClientVersion 			= 1.04.05
