; MainInfo do build WEB. O do PC e Client/MainInfo.ini, com o IP real.
;
; POR QUE UM ARQUIVO SEPARADO: o navegador nao abre socket TCP cru. O Emscripten
; traduz sockets POSIX em WebSocket e monta a URL como ws://<host>:<porta> a partir
; do endereco passado ao connect() -- entao o cliente Web tem de apontar para a
; PONTE (web/ws_tcp_bridge.py), nao para o servidor.
;
; A ponte nao pode escutar no mesmo host:porta do servidor, e no Windows nao ha
; apelido de loopback (bind em 127.0.0.2 volta PermissionError), entao a distincao e
; por PORTA: a ponte escuta 44406 e repassa para 44405.
;
;   python web/ws_tcp_bridge.py 127.0.0.1 192.168.1.253 44406
;
; (o terceiro argumento e a porta escutada; ajuste o destino dentro da ponte se o
; servidor mudar de porta)
[MainInfo]
IpAddress 			= 127.0.0.1
IpAddressPort 			= 44406

; Crowd LOD (ver CROWD_LOD_PLAN.md). Este arquivo e o unico canal de configuracao
; de render do Web: o navegador nao passa linha de comando, entao sem estas chaves
; o alvo fica preso ao default compilado.
;
;   CrowdLod          off | on | compare   (default off -- Fase 0 so mede)
;   CrowdLodPixelsL1  altura em PIXELS na tela abaixo da qual o personagem cai
;   CrowdLodPixelsL2  para o nivel seguinte. Precisam ser decrescentes: L1 > L2 > L3.
;   CrowdLodPixelsL3
;   CrowdMaxFull      teto de personagens em qualidade plena; 0 = sem teto
;
; Rig de medicao, um pedido por TIPO (0 = desligado). NAO ligar em build para jogador:
; e instrumento, e o valor aparece nas colunas crowd_spawn* do CSV. Separados porque
; player (~15 malhas + sombra) e monstro (1 malha de corpo) custam coisas diferentes;
; um numero unico nao permitiria isolar qual move o frame.
;
; Monstro e NPC sao clonados dos tipos que JA existem vivos no mapa -- modelo de outro
; mapa pode nao estar carregado, e o cliente desiste de desenhar em silencio. Sem
; nenhum vivo para clonar, nada e criado (aparece no log e em chars_monsters_avg).
;
;   CrowdSpawn          players (CrowdSpawnPlayers e sinonimo)
;   CrowdSpawnMonsters  monstros
;   CrowdSpawnNpcs      NPCs
CrowdLod			= off
CrowdLodPixelsL1		= 64
CrowdLodPixelsL2		= 32
CrowdLodPixelsL3		= 12
CrowdMaxFull			= 0
CrowdSpawn			= 0
CrowdSpawnMonsters		= 0
CrowdSpawnNpcs			= 0

