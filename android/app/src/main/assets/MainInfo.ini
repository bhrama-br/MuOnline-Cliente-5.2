; MainInfo do build ANDROID.
;
; Contem SOMENTE a secao [Render]. Isso e deliberado: CarregarMainInfo aplica cada
; chave que reconhece e ignora as demais, entao um arquivo so com chaves de render
; nao muda nada de rede, de versao de cliente nem de decifragem.
;
; O MainInfo.ini do PC (Client/MainInfo.ini) traz IpAddress, ClientVersion,
; OnlyCryptedLua e PrivateCode. Empacotar aquele arquivo aqui mudaria o regime de
; decifragem de Lua e de arquivos protegidos do alvo Android de uma vez, o que nao
; tem nada a ver com Crowd LOD -- e uma decisao separada, com teste separado.
;
; POR QUE ESTE ARQUIVO EXISTE: o Android nao tem linha de comando. Sem canal de
; arquivo, as chaves de render ficariam presas ao default compilado e calibrar LOD
; por dispositivo exigiria recompilar o APK.
;
; A extracao acontece em MainActivity.extractAssets("MainInfo.ini", dataRoot). Um
; arquivo ja presente na raiz de dados (empurrado com adb push) NAO e sobrescrito,
; entao da para calibrar no dispositivo sem rebuild.
[Render]

; off | on | compare  -- default off: a Fase 0 do Crowd LOD so mede.
CrowdLod = off

; Altura em PIXELS na tela abaixo da qual o personagem cai para o nivel seguinte.
; Precisam ser decrescentes (L1 > L2 > L3); valor inconsistente e recusado e o
; default continua valendo.
CrowdLodPixelsL1 = 64
CrowdLodPixelsL2 = 32
CrowdLodPixelsL3 = 12

; Teto de personagens em qualidade plena. 0 = sem teto.
CrowdMaxFull = 0

; Rig de medicao, um pedido por TIPO. 0 = desligado. NAO ligar em build para jogador:
; e instrumento, e o valor aparece nas colunas crowd_spawn* do CSV.
;
; Separados porque player (~15 malhas de equipamento + passe de sombra proprio) e
; monstro (uma malha de corpo, sem sombra separada) custam coisas diferentes. Monstro e
; NPC sao clonados dos tipos que JA existem vivos no mapa: modelo de outro mapa pode
; nao estar carregado e o cliente desiste de desenhar em silencio -- 200 monstros
; invisiveis de custo zero pareceriam ganho. Sem nenhum vivo para clonar, nada e criado.
CrowdSpawn = 0
CrowdSpawnMonsters = 0
CrowdSpawnNpcs = 0
