<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>MU Legacy WebGL2 — diag</title></head>
<body style="margin:0;background:#000;overflow:hidden">
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()" onmousedown="this.focus()" style="width:100vw;height:100vh"></canvas>
<div id="log" style="position:fixed;left:0;bottom:0;width:100vw;height:40vh;overflow:auto;background:rgba(0,0,0,.82);color:#0f0;font:11px/1.35 Consolas,monospace;white-space:pre-wrap;padding:6px;box-sizing:border-box;z-index:9"></div>
<div id="hud" style="position:fixed;right:8px;top:8px;color:#ff0;font:12px Consolas,monospace;z-index:10;background:rgba(0,0,0,.7);padding:4px 8px"></div>
<script>
// Qual binario carregar: ?build=base usa o .wasm commitado (antes do flip do
// -statictransformcache); o default usa o build atual da working tree.
var IS_BASE = new URLSearchParams(location.search).get('build') === 'base';
var GLUE    = IS_BASE ? 'base.js' : 'mu_legacy_web.js';
var WASM    = IS_BASE ? 'base.wasm' : 'mu_legacy_web.wasm';
document.getElementById('hud').textContent = 'build=' + (IS_BASE ? 'BASE (HEAD)' : 'ATUAL (working tree)');

var logEl = document.getElementById('log'), lines = 0, beacons = 0, seq = 0;

// Canal de volta para o agente: cada linha vira um GET que o python -m http.server
// grava no access log. Evita depender de alguem copiar o painel a mao.
function beacon(txt) {
  // Ruido por frame que so ocupa espaco no access log; continua visivel no painel.
  if (/CurrentProtocolState|^\s*\.\.\. \d+ arquivos|^\s*ausente:/.test(txt)) return;
  if (beacons++ > 2500) return;
  var tag = IS_BASE ? 'BASE' : 'ATUAL';
  new Image().src = '/__log/' + tag + '/' + (seq++) + '?m=' +
                    encodeURIComponent(String(txt).slice(0, 400));
}
function put(tag, txt) {
  if (lines++ > 4000) return;
  var d = document.createElement('div');
  d.textContent = tag + txt;
  if (tag !== '  ') d.style.color = '#f66';
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  beacon(tag + txt);
  try { console.log(tag + txt); } catch (e) {}
}
window.addEventListener('error', function (e) {
  put('!! ', 'window.onerror: ' + (e.message || e) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
});
window.addEventListener('unhandledrejection', function (e) { put('!! ', 'unhandled rejection: ' + e.reason); });

// Um contexto WebGL perdido e a causa classica de "so tela preta" com o loop
// ainda vivo: o jogo continua rodando e nenhum draw chega na tela.
var cv = document.getElementById('canvas');
cv.addEventListener('webglcontextlost', function (e) { put('!! ', 'WEBGL CONTEXT LOST: ' + (e.statusMessage || '')); });
cv.addEventListener('webglcontextrestored', function () { put('!! ', 'webgl context restored'); });

var Module = {
  canvas: cv,
  print:    function (t) { put('  ', t); },
  printErr: function (t) { put('!! ', t); },
  onAbort:  function (r) { put('!! ', 'ABORT: ' + r); },
  locateFile: function (path, prefix) {
    if (path === 'mu_legacy_web.wasm') path = WASM;
    return prefix + path + '?v=diag';
  }
};

// Heartbeat: separa "morreu" de "roda mas desenha preto". Le o pixel do centro
// do canvas a cada 2s; se o rAF parou, frames congela.
var frames = 0, raf = window.requestAnimationFrame, pix = 'sem amostra';
window.requestAnimationFrame = function (cb) {
  return raf(function (t) {
    frames++;
    var r = cb(t);
    // Amostra do framebuffer AINDA dentro do frame, logo depois do callback do
    // jogo: aqui o drawing buffer continua valido mesmo sem preserveDrawingBuffer.
    // (3,25,44) e o glClearColor de RenderLegacyFrame -- se sair isso, o clear
    // roda e a cena nao desenha por cima. (0,0,0) e clear nenhum.
    if (frames % 120 === 1) {
      try {
        var gl = cv.getContext('webgl2');
        if (gl && !gl.isContextLost()) {
          var p = new Uint8Array(4);
          gl.readPixels(cv.width >> 1, cv.height >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
          pix = p[0] + ',' + p[1] + ',' + p[2] + ',' + p[3];

          // O pixel central nao bate com o glClearColor de RenderLegacyFrame
          // (3,25,44). As quatro causas que produzem exatamente isso com o loop
          // vivo: FBO preso, colorMask fechada, scissor preso, viewport degenerado.
          var fbo  = gl.getParameter(gl.FRAMEBUFFER_BINDING);
          var mask = gl.getParameter(gl.COLOR_WRITEMASK);
          var sc   = gl.getParameter(gl.SCISSOR_BOX);
          var vp   = gl.getParameter(gl.VIEWPORT);
          var cc   = gl.getParameter(gl.COLOR_CLEAR_VALUE);

          // Le tambem o framebuffer PADRAO, restaurando o binding em seguida.
          var q = new Uint8Array(4);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.readPixels(cv.width >> 1, cv.height >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, q);
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

          put('  ', '[gl] fbo=' + (fbo ? 'FBO-PRESO' : 'default') +
                    ' colorMask=' + mask.join(',') +
                    ' scissorTest=' + gl.isEnabled(gl.SCISSOR_TEST) +
                    ' scissorBox=' + sc.join(',') +
                    ' viewport=' + vp.join(',') +
                    ' clearColor=' + Array.prototype.map.call(cc, function (v) { return Math.round(v * 255); }).join(',') +
                    ' pixelDefaultFB=' + q.join(','));
        }
      } catch (e) { pix = 'erro: ' + e; }
    }
    return r;
  });
};
setInterval(function () {
  var gl = cv.getContext('webgl2');
  put('  ', '[hb] rAF=' + frames + ' canvas=' + cv.width + 'x' + cv.height +
            ' cssW=' + cv.clientWidth + 'x' + cv.clientHeight +
            ' centro=' + pix + ' ctxLost=' + (gl ? gl.isContextLost() : 'n/a'));
}, 2000);
</script>
<script>
// O glue precisa ser criado por script: um <script src=""> ja e "already started"
// no parse e trocar o .src depois nao dispara fetch nenhum.
var s = document.createElement('script');
s.async = true;
s.src = GLUE + '?v=diag';
s.onerror = function () { put('!! ', 'FALHOU ao carregar o glue: ' + s.src); };
put('  ', '[boot] carregando ' + s.src);
document.body.appendChild(s);
</script>
</body>
</html>
